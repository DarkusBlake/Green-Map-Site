<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта качества городских кварталов</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="controls">
        <div class="city-selector">
            <h1><i class="fas fa-city"></i> Выберите город</h1>
            <div class="city-buttons">
                <button class="city-btn" data-city="moscow">Москва</button>
                <button class="city-btn active" data-city="ekaterinburg">Екатеринбург</button>
                <button class="city-btn" data-city="peter">Санкт-Петербург</button>
            </div>
        </div>
        
        <div class="action-buttons">
            <button id="toggle-quarters-btn">
                <i class="fas fa-eye"></i> Показать кварталы
            </button>
        </div>
    </div>
    
    <div id="map"></div>

    <!-- Панель слоёв -->
    <div id="layers-panel" class="layers-panel">
        <h4><i class="fas fa-layer-group"></i> Инструменты</h4>
        <div class="layer-item">
            <label class="layer-switch">
                <input type="checkbox" id="layer-quarters-checkbox" checked>
                <span class="slider round"></span>
            </label>
            <span><i class="fas fa-building"></i> Оценка кварталов</span>
        </div>
        <div class="layer-item">
            <label class="layer-switch">
                <input type="checkbox" id="layer-roads-checkbox">
                <span class="slider round"></span>
            </label>
            <span><i class="fas fa-road"></i> Оценка дорог</span>
        </div>
        <div class="layer-item">
            <label class="layer-switch">
                <input type="checkbox" id="layer-parks-checkbox">
                <span class="slider round"></span>
            </label>
            <span><i class="fas fa-tree"></i> Оценка парков</span>
        </div>
    </div>

    <!-- Информационная панель -->
    <div id="info-panel" class="info-panel">
        <div class="info-placeholder">Нажмите на квартал, чтобы увидеть детали</div>
    </div>

    <div id="loading" class="loading-spinner">
        <div class="spinner"></div>
        <div>Загрузка данных...</div>
    </div>

    <!-- Легенда -->
    <div id="legend" class="legend">
        <h4><i class="fas fa-key"></i> Легенда качества</h4>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #7fd968ff"></div>
            <span>1 - Плохое качество</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #35b444ff"></div>
            <span>2 - Нормальное качество</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #096f0eff"></div>
            <span>3 - Хорошее качество</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    
    <script src="./js/utils.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/city.js"></script>
    <script src="./js/layers.js"></script>
    <script src="./js/search.js"></script>
    <script src="./js/map.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
